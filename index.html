<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>원화 대비 주요 환율 추이</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="content">
        <section class="section">
          <div class="section__heading">
            <div>
              <h2>통화별 요약 카드</h2>
            </div>
            <p class="section__meta-line">
              <span>기준 시각 <strong id="updated-at"></strong></span>
              <span>데이터 범위 최근 3개월</span>
            </p>
          </div>
          <div class="card-strip" id="summary-cards"></div>
        </section>

        <section class="section chart-section">
          <div class="section__heading">
            <div>
              <h2>메인 비교 차트</h2>
            </div>
            <div class="toggle-group chart-controls" id="mode-toggle" aria-label="보기 방식 선택">
              <button class="toggle-group__button" data-mode="absolute">실환율 보기</button>
              <button class="toggle-group__button is-active" data-mode="indexed">변동률로 비교</button>
            </div>
          </div>

          <div class="chart-panel">
            <canvas id="main-chart" width="960" height="520" aria-label="환율 비교 차트"></canvas>
            <div class="chart-tooltip" id="chart-tooltip" hidden></div>
          </div>

          <div class="active-series" id="active-series"></div>
        </section>

        <section class="section details-section">
          <div class="section__heading">
            <div>
              <h2>상세 수치</h2>
            </div>
          </div>

          <div class="accordion-list" id="details-accordion"></div>

          <div class="table-wrap">
            <table class="details-table">
              <thead>
                <tr>
                  <th>통화</th>
                  <th>현재가</th>
                  <th>3개월 전</th>
                  <th>증감액</th>
                  <th>3개월 증감률</th>
                  <th>최고가</th>
                  <th>최저가</th>
                  <th>변동폭</th>
                </tr>
              </thead>
              <tbody id="details-table-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="./config.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
